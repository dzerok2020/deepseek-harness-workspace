# Portable budget overlay for the current web profile; contains no credentials.
# Desired per-model operating policy, checked by tools/model_budgets.py.
# or context values originate from the reported 2026-10-25 OmniRoute catalog;
# advertised catalog capacity is NOT verified end-to-end request acceptance.
# cgw stays at the conservative 128000 policy; unknown models fail closed.
# Do not merge/restart automatically: review current routing and back up first.
# Health/repair compare only models present; they never remove or add models.
# Explicit model budgets take precedence over provider defaults.
