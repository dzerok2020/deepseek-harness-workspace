# Versioned operating reference, checked by tools/model_budgets.py.
# Settings owns live configuration; explicit sync: python3 -B tools/sync_model_budgets.py.
# Review preview before apply; docs/model-budget-sync.md explains the one-way flow.
# Present routes synced from saved Settings on 2026-10-30; not inferred from catalog.
# Earlier catalog evidence: docs/aegis/work/2026-10-29-dsh-audit/budget-sources.md.
# Absent routes retain their earlier reference values; no automatic removal.
# Operating budgets are NOT verified end-to-end upstream request acceptance.
# cgw stays separate at 128000/16384; unknown models still fail closed.
