# Evidence and conservative exceptions: docs/aegis/work/2026-10-29-dsh-audit/budget-sources.md.
# Advertised catalog capacity is NOT verified end-to-end request acceptance.
# Rows without advertised output retain a conservative 16384 operating cap.
# cgw stays separate at 128000/16384; unknown models still fail closed.
# Do not merge/restart automatically: review current routing and back up first.
# Health/repair compare only models present; they never remove or add models.
