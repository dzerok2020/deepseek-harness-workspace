- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: standard
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    performanceUsage: compact

# Hindsight-first rollout: preserve old stores, disable overlapping runtimes.
- id: mnemon
  disabled: true
- id: stratagate-memory
  disabled: true
- id: openviking-memory-runtime
  disabled: true
- id: hindsight
  disabled: false
- insert:
    - id: openviking-tools-only
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: openviking
        transport: stdio
        command: /home/dzerok/.local/share/mise/installs/node/26.8.2/bin/node
        args:
          - /home/dzerok/.dsh/profiles/web/node_modules/@openviking/dsh-memory-plugin/servers/mcp-proxy.mjs
        env:
          ELECTRON_RUN_AS_NODE: '1'
        toolCallTimeoutMs: 60000
    - id: openviking-skills-only
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: openviking
        includeDefaultRoots: false
        bundledSkillDir: /home/dzerok/.dsh/profiles/web/node_modules/@openviking/dsh-memory-plugin/skills
        watch: false

- id: dsh-ecc-adapter
  config:
    eccRoot: /home/dzerok/.dsh/ecc/source
    dataRoot: /home/dzerok/.dsh/profiles/web/ecc-state
    expectedRevision: b92f181b3b748d1abbc2afd94af6aa7d8c8fca29
    selective: true
    enableMemory: true
    enableHooks: true
    enablePlanner: true
    enablePayloadHooks: true
    # Chỉ nạp 20 skill ECC đã từng được dùng thật trong ~600 session (đo 2026-11-01).
    # Bỏ key này = quay lại toàn bộ 268 skill policy duyệt. Thêm tên = mở lại skill đó.
    skillAllowlist:
      - accessibility
      - agent-eval
      - agent-harness-construction
      - agent-introspection-debugging
      - agent-security-hardening
      - agent-self-evaluation
      - automation-audit-ops
      - backend-patterns
      - change-impact
      - conventional-commit-review
      - documentation-lookup
      - frontend-a11y
      - frontend-patterns
      - intent-driven-development
      - nextjs-turbopack
      - production-audit
      - react-patterns
      - security-review
      - terminal-ops
      - test-collaboration
    toolMap:
      Read: ops_read_files
      Write: write
      Edit: edit
      Grep: ops_grep
      Glob: ops_glob
      Bash: bash
      WebSearch: web_search
      WebFetch: web_fetch
      AskUserQuestion: ask_user_question
