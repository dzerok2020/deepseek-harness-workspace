# Provide local skill discovery on the deployment (global) plane as well.
# Root cause of the missing skills: this profile's node_modules held
# `@deepseek-ai/dsh-skill-filesystem@0.1.1-rc.2` (pulled in to satisfy peers of
# aegis, agent-useful-skills and @openviking/dsh-memory-plugin) while the
# runtime is 0.2.0-rc.2. The runtime's compatibility preflight therefore
# disabled *every* row resolving that package -- including the row the web-app
# bundle mounts inside each agent preset -- so the local skills in
# ~/.dsh/skills, ~/.agents/skills and the project skill roots never reached the
# agent catalog.
# Fixed at the source with, in this profile directory:
#   pnpm add --save-exact @deepseek-ai/dsh-skill-filesystem@0.2.0-rc.2
# which is why the plain specifier below now resolves to the runtime-matched
# 0.2.0-rc.2 copy. This row keeps the same provider registered on the global
# plane too, so discovery does not depend on the preset plane alone.
# Remove this block to return to the stock per-preset placement.
- insert:
    - id: skill-filesystem-global
      name: '@deepseek-ai/dsh-skill-filesystem'
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: modsearch
    fetchProvider: fs-quality-fetch
# Agent preset "code-audit": ~39 tool thay vì 118.
# Bản sao rút gọn của preset standard (bỏ delegation/team, goal, schedule, plan-mode, present)
# + plugin dsh-tool-filter lọc các tool GLOBAL còn lại.
# Lưu ý: đây là bản copy; khi nâng cấp DSH nên so lại với presets/standard.patch.yml.
- insert:
    - id: preset-code-audit
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: code-audit
        name: 'Vibe / Audit'
        description: 'Soi code, audit, đo token: chỉ đọc + chạy test, không ghi file,
          không market/team/schedule/expert.'
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model. Bạn đang
                ở chế độ AUDIT: chỉ đọc, đo và báo cáo; không sửa file trừ khi
                người dùng yêu cầu rõ.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-filter
            name: 'dsh-tool-filter'
            config:
              # 2026-11-01: bỏ allow list cũ — 10/24 tên không tồn tại (ops_bash + 9
              # hindsight_*) nên rail mất ops_grep/ops_glob/ops_inspect_local_file/
              # ops_result và compress/decompress/memory_*. Dùng deny thay allow để
              # tool mới thêm sau này tự đi qua.
              deny:
                - cache_search
                - conductor_dispatch
                - domain_search
                - free_search_test
                - get_expert_team
                - interrupt_agent
                - list_expert_teams
                - list_experts
                - market_info
                - market_install
                - market_installed
                - market_search
                - market_uninstall
                - multi_search
                - open_custom_expert_editor
                - open_expert_team_editor
                - platform_search
                - propose_custom_expert
                - propose_expert_team
                - research
                - summon_expert
                - summon_expert_team
                - summon_experts
                - team_task_create
                - team_task_get
                - team_task_list
                - team_task_update
                - video_search
                - x_search

