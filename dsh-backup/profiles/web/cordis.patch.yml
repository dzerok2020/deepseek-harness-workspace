# Agent preset "vibe-lean": bản sao standard, bỏ 8 nhóm tool đã ĐO là gần như
# không dùng (12.368 lần gọi tool trong 120 session, đo 2026-11-01):
#   market_* (2 lần/6 KB), schedule_* (7/6 KB), workflow (0/3 KB),
#   expert+summon (0/~6 KB), conductor (0/1 KB), search phụ (0-1/~8 KB).
# Mục tiêu: bớt ~30 KB schema (~7,5K token/request) mà không mất tool đang dùng.
# schedule/workflow do preset tự mount nên phải bỏ row; phần còn lại là tool global
# nên lọc bằng dsh-tool-filter deny (deny an toàn hơn allow: tool mới tự đi qua).
